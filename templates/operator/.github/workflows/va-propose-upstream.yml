# status: ready の上流候補がマージされたら、サニタイズして VA に PR を出す。
#
# Secrets:
#   CLAUDE_CODE_OAUTH_TOKEN か ANTHROPIC_API_KEY
#   VA_UPSTREAM_TOKEN … VA リポジトリの contents:write と pull-requests:write（fine-grained PAT）
name: VA propose upstream

on:
  push:
    branches: [main]
    paths: ["operator/upstream-candidates/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: va-propose-upstream
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ready
        run: |
          n=$(grep -l '^status: ready' operator/upstream-candidates/*.md 2>/dev/null | wc -l || true)
          echo "count=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.count != '0'
        with:
          node-version: "22"
      - name: Clone upstream
        if: steps.ready.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.VA_UPSTREAM_TOKEN }}
          UPSTREAM_REPO: ${{ vars.VA_UPSTREAM_REPO || 'imohiyoko/VA' }}
        run: |
          gh repo clone "$UPSTREAM_REPO" work/upstream -- -q   # トークンは remote URL に残らない
          git -C work/upstream config user.name "va-bot"
          git -C work/upstream config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p work/proposals
      - name: Prepare proposals (no push rights in this step)
        if: steps.ready.outputs.count != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude -p --model "$(python3 scripts/va.py config retro_model)" --max-turns 60 \
            --allowedTools "Read,Grep,Glob,Write,Edit,Bash(git -C work/upstream:*),Bash(python3 work/upstream/scripts/va.py validate:*),Bash(bash scripts/va-sanitize-check.sh:*)" \
            --disallowedTools "Bash(git push:*),Bash(gh:*),Bash(curl:*)" \
            "Read .agents/prompts/upstream-proposer.md and follow it. Candidates: operator/upstream-candidates/*.md with status: ready. Upstream clone: work/upstream. PR descriptions: work/proposals/."
      - name: Sanitize, push and open PRs
        if: steps.ready.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.VA_UPSTREAM_TOKEN }}
        run: |
          gh auth setup-git
          bash scripts/va-propose-push.sh work/upstream work/proposals operator/sanitize-denylist.txt
      - name: Record candidate status
        if: steps.ready.outputs.count != '0'
        run: |
          git config user.name "va-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operator/upstream-candidates
          git diff --cached --quiet || { git commit -qm "Mark upstream candidates as submitted"; git push -q; }
